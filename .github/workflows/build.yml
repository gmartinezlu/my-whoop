name: Build iOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test packages
        run: |
          set -euo pipefail
          for package in Protocol Compute Storage Sync BLE UI; do
            swift test --package-path "$package"
          done

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project WhoopPersonal.xcodeproj \
            -scheme MyWhoop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/MyWhoop.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BUNDLE_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          PACKAGE_TYPE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP_PATH/Info.plist")"
          test "$BUNDLE_IDENTIFIER" = "personal.mywhoop.reader"
          test "$PACKAGE_TYPE" = "APPL"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP_PATH/Info.plist" >/dev/null
          test -f "$APP_PATH/$EXECUTABLE_NAME"
          test -x "$APP_PATH/$EXECUTABLE_NAME"
          test -f "$APP_PATH/Assets.car"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' App/MyWhoop.entitlements | grep -q true
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' framework; do
              codesign --force --sign - "$framework"
            done
            find "$APP_PATH/Frameworks" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' dylib; do
              codesign --force --sign - "$dylib"
            done
          fi
          codesign --force --sign - --entitlements App/MyWhoop.entitlements "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" >/tmp/mywhoop-entitlements.plist 2>/dev/null
          grep -q "com.apple.developer.healthkit" /tmp/mywhoop-entitlements.plist
          rm -rf build/ipa build/validate
          mkdir -p build/ipa/Payload build/validate
          ditto "$APP_PATH" "build/ipa/Payload/MyWhoop.app"
          (cd build/ipa && ditto -c -k --sequesterRsrc --keepParent Payload ../MyWhoop-unsigned.ipa)
          ditto -x -k build/MyWhoop-unsigned.ipa build/validate
          test -d build/validate/Payload/MyWhoop.app
          test -f build/validate/Payload/MyWhoop.app/Info.plist
          VALIDATED_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' build/validate/Payload/MyWhoop.app/Info.plist)"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' build/validate/Payload/MyWhoop.app/Info.plist >/dev/null
          test -f "build/validate/Payload/MyWhoop.app/$VALIDATED_EXECUTABLE"
          test -x "build/validate/Payload/MyWhoop.app/$VALIDATED_EXECUTABLE"
          test -f build/validate/Payload/MyWhoop.app/Assets.car
          test ! -f build/validate/Payload/MyWhoop.app/embedded.mobileprovision
          codesign -d --entitlements :- build/validate/Payload/MyWhoop.app >/tmp/mywhoop-validated-entitlements.plist 2>/dev/null
          grep -q "com.apple.developer.healthkit" /tmp/mywhoop-validated-entitlements.plist
          test "$(find build/validate -maxdepth 1 -type d -name Payload | wc -l | tr -d ' ')" = "1"
          test "$(find build/validate/Payload -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" = "1"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyWhoop-unsigned-ipa
          path: build/MyWhoop-unsigned.ipa
